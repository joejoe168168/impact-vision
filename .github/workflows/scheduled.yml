name: Scheduled checks

# Regulatory facts go stale without anyone pushing code: re-run the knowledge
# freshness gate and the extraction benchmark every Monday (roadmap v8 W4).
on:
  schedule:
    - cron: "17 2 * * 1"
  workflow_dispatch:

jobs:
  knowledge:
    name: Knowledge freshness & extraction gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Every knowledge row sourced and re-verified within 180 days
        run: python scripts/check_knowledge.py
      - name: Extraction benchmark gate
        run: python -m openharness.impact.extraction_eval --extractor regex --summary
