name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  import-smoke:
    name: Import smoke check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Verify all __init__.py files exist
        run: python scripts/check_imports.py --verify-init
      - name: Smoke-test package imports
        run: python scripts/check_imports.py --smoke
      - name: Verify tool registry bootstraps
        run: python scripts/check_imports.py --registry

  test:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Run tests (coverage floor for the impact engine)
        run: pytest tests/ -q --tb=short --cov=openharness.impact --cov-fail-under=85
      - name: Knowledge freshness gate (every row sourced; re-verified within 180 days)
        run: python scripts/check_knowledge.py
      - name: Generated tool reference is current
        run: python scripts/build_tool_reference.py --check
      - name: Extraction benchmark gate (blocking; deterministic regex extractor)
        run: python -m openharness.impact.extraction_eval --extractor regex --summary

  typecheck:
    name: Type check (v8 modules)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: mypy (new and security-critical modules are kept clean)
        run: >-
          mypy --ignore-missing-imports
          src/openharness/impact/expected_impact.py src/openharness/impact/metric_relevance.py
          src/openharness/impact/text_sections.py src/openharness/api_gateway/security.py

  security:
    name: Dependency & code security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip setuptools  # runner tooling, not project deps
          pip install -e ".[web,office,assurance]" pip-audit bandit
      - name: pip-audit (known vulnerabilities in installed dependencies)
        run: pip-audit --progress-spinner off --skip-editable
      - name: bandit (medium+ severity, product code)
        run: bandit -q -ll -r src/openharness/impact src/openharness/web src/openharness/api_gateway

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install ruff
        run: pip install "ruff>=0.15,<0.16"  # 0.16 enables new default rules; upgrade deliberately
      - name: Ruff check
        run: ruff check src/

  frontend:
    name: Frontend typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: Install dependencies
        working-directory: frontend/terminal
        run: npm ci
      - name: TypeScript check
        working-directory: frontend/terminal
        run: npx tsc --noEmit

  wheel-smoke:
    name: Installed-wheel smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Build wheel
        run: pip install build && python -m build --wheel
      - name: Install wheel into a clean venv
        run: |
          python -m venv /tmp/wheel-venv
          /tmp/wheel-venv/bin/pip install dist/*.whl
      - name: Smoke-test bundled data from outside the repo
        working-directory: /tmp
        run: /tmp/wheel-venv/bin/python "$GITHUB_WORKSPACE/scripts/wheel_smoke.py"

  report-qa:
    name: Report accessibility & layout QA
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install with PDF + browser tooling
        run: |
          pip install -e ".[dev,pdf]" axe-playwright-python
          python -m playwright install --with-deps chromium
      - name: axe-core + responsive checks (390 / 1024 / 1440 px, light & dark)
        run: pytest tests/visual -q --tb=short
