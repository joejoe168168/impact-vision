version: "2026-10"
as_of: "2026-08-29"
source: Impact Vision editorial crosswalk built from each framework's published standard
source_note: >
  Canonical extensions to the legacy cross-reference map. Target is the
  LP-comparable core (climate, energy, water, waste, social, governance,
  SFDR PAI / EDCI) so one MetricRecord can tag ESRS, ISSB, GRI, and EDCI.
  taxonomy_uri values are screening qnames pending the Official Journal ESRS
  XBRL taxonomy and ISSB taxonomy alignment.
