sbti:
  standards:
    - id: CNZS_V2
      title: "Corporate Net-Zero Standard V2.0"
      published: "2026-06-11"
      usable_from: "2027-02-01"
      verified: primary
      source_url: https://sciencebasedtargets.org/blog/the-corporate-net-zero-standard-v2-0-is-here-what-comes-next
    - id: CNZS_V1
      title: "Corporate Net-Zero Standard V1.3.1"
      usable_until: "2028-01-31"
      verified: primary
      note: >-
        Per the SBTi net-zero page; the 2026-06-11 SBTi blog says V1 submissions run
        "through the end of 2027". From 2028-02-01 new submissions must use V2.0.
      source_url: https://sciencebasedtargets.org/net-zero
    - id: NEAR_TERM_CRITERIA
      title: "Corporate Near-Term Criteria V5.3.1"
      verified: unverified
      note: Version and its 2026-04-14 date seen in a search snippet only.
      source_url: https://files.sciencebasedtargets.org/production/files/SBTi-criteria.pdf
  # Which version's numerical thresholds frameworks/sbti.py applies. V2.0 thresholds
  # are not recorded: the standard's text was not read, so none are invented. The
  # check keeps the V1 numbers, names the versions above and says so in its findings.
  thresholds:
    version: CNZS_V1
    v2_thresholds_recorded: false
    note: >-
      V1 numerical thresholds (42% near-term over 10 years for 1.5°C, net-zero by 2050 with
      at least 90% reduction, Scope 3 target when Scope 3 is 40%+ of the inventory, 67%
      coverage). V2.0 criteria not encoded.

eu_taxonomy:
  delegated_acts:
    - id: "(EU) 2026/73"
      title: "Omnibus simplification of the Taxonomy Disclosures, Climate and Environmental Delegated Acts"
      oj_date: "2026-01-08"
      in_force: "2026-01-28"
      applies_to: "2025 reporting periods, with an option to defer to the 2026 reporting period"
      verified: secondary
      note: EUR-Lex could not be opened; all values rest on KPMG's summary of the act.
      source_url: https://kpmg.com/xx/en/our-insights/ifrg/2025/EU-taxonomy-amendments.html
      legal_text_url: https://eur-lex.europa.eu/eli/reg_del/2026/73/oj/eng
  simplification:
    materiality_threshold_pct: 10.0   # activities together below this share of turnover / CapEx / OpEx
    materiality_rule: >-
      Non-financial companies may report activities that together make up less than 10% of
      turnover, CapEx or OpEx as non-material, without an alignment assessment.
    opex_rule: >-
      The OpEx template may be omitted when OpEx is not material to the business model;
      total OpEx and the reason must be disclosed.
    templates: "Non-financial templates fall from 78 to 28 data points; gas and nuclear templates are folded in."
    dnsh: "Appendix C (pollution prevention; use and presence of chemicals) is simplified."
