# Framework pack updates: GRI, SBTi, EU Taxonomy (R6 / R7).
# Every row was read at the source on as_of. "verified: secondary" means the issuing
# body's own page did not state the fact and a secondary source was used;
# "verified: unverified" rows are watchlist items, not to be relied on.
schema_version: 1
as_of: "2026-11-10"

gri:
  topic_standards:
    - id: GRI 101
