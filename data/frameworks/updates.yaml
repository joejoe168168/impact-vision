      source_url: https://www.globalreporting.org/umbraco/Surface/ResourceCentre/PopupResource?id=24534
    - id: GRI 102
      title: "Climate Change 2025"
      published: "2025-06"
      effective_date: "2027-01-01"
      supersedes: ["305-1", "305-2", "305-3", "305-4", "305-5", "201-2"]
      verified: secondary
      note: >-
        Effective date and superseded disclosures from BDO; whether the trigger is reports
        published or reporting periods starting on or after the date is not confirmed.
      source_url: https://www.bdo.ch/en-gb/insights/gri-updates-2025-2027-transparency-and-impact-in-sustainability
    - id: GRI 103
      title: "Energy 2025"
      published: "2025-06"
      effective_date: "2027-01-01"
