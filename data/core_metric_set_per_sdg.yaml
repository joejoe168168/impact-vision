# Core Metric Set per SDG (rebuilt 2026-10-07, methodology 1.1.0)
#
# A curated short list of IRIS+ 5.3c metric IDs that best evidence each SDG.
# sdg_mapper.py scores SDG coverage against this set, so goals of very
# different breadth (SDG 8 has 468 IRIS+ metrics; SDG 14 has 26) stay
# comparable.
#
# Rebuilt because the previous list's comments named the intended concept but
# about half the IDs pointed at different metrics (e.g. "GHG Emissions Avoided"
# -> OI4112, which is Scope 1) or did not exist. Every ID below exists in the
# catalogue, is tagged to its goal, and its comment is the catalogue name;
# tests/test_core_metric_sets.py enforces all three.
#
# Selection: outcome / output metrics a company reports for the goal, plus key
# policies. Own-footprint metrics (OI1479, OI4112) stay under SDG 13 but count
# at reduced weight (methodology `operational_footprint_metrics`). SDG 16 has
# thin IRIS+ coverage; SDG 17 has no IRIS+ metrics, so its set is empty.

version: "1.1"
source: "GIIN IRIS+ 5.3c catalogue (curated)"
