# Core Metric Set per sector
#
# The gap analysis compares a company's reported IRIS+ metrics against a
# "core set". A single microfinance-flavoured set used to be applied to every
# company, so a pig farm was told its biggest gap was "Client Protection
# Policy" and to start tracking "Revenue from Grants and Donations".
#
# Each sector set = `universal` (cross-cutting workforce, governance, climate
# and target-setting metrics every company should report) + the sector list
# below. Sectors not listed here fall back to `default`, which reproduces the
# historical CORE_METRIC_SET_IDS so existing reports don't shift.
#
# Keys are canonical engine sectors (see normalize_sector in
# tools/impact/common.py). Every ID must exist in the IRIS+ 5.3c catalog —
# tests/test_sector_awareness.py enforces this.

version: "1.0"
source: "GIIN IRIS+ 5.3c catalog; curated per sector (Impact Vision v7 W0.3)"
as_of: "2026-10-06"

universal:
  - OI8869   # Permanent Employees: Total
  - OI6213   # Full-time Employees: Female
  - OI1571   # Full-time Employees: Female Managers
  - OI1582   # Wage Equity
  - OI4724   # Workers Earning a Living Wage or Higher
  - OI1075   # Board of Directors: Total
  - OI1479   # Greenhouse Gas Emissions: Total
  - OI4112   # Greenhouse Gas Emissions: Direct (Scope 1)
  - OD4091   # Social and Environmental Targets
  - OI4732   # Social and Environmental Performance Reporting

# Historical one-size-fits-all set — used when the sector is unknown.
default:
  - OD8350   # Client Model
  - OI4753   # Client Protection Policy
  - PI4060   # Client Individuals: Total
  - OI8869   # Permanent Employees: Total
  - OI1571   # Full-time Employees: Female Managers
  - OI6213   # Full-time Employees: Female
  - FP3021   # Revenue from Grants and Donations
  - FP4761   # Revenue Growth
  - OI1479   # Greenhouse Gas Emissions: Total
  - OI4112   # Greenhouse Gas Emissions: Direct (Scope 1)
  - OD4091   # Social and Environmental Targets
  - OI4732   # Social and Environmental Performance Reporting
  - OI1582   # Wage Equity
  - OI1075   # Board of Directors: Total
  - OI5049   # Client Feedback System
  - OI4324   # Community Service Policy

