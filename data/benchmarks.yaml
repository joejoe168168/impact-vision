kpi:
  data_status: illustrative
  source: GIIN Impact Performance Benchmarks (offline snapshot, illustrative)
  rows:
  - sector: agriculture
    metric_id: farmers_reached
    metric_label: Smallholder farmers reached
    unit: farmers
    p25: 1500.0
    p50: 6000.0
    p75: 18000.0
    p90: 45000.0
    sample_size: 180
    sdg:
    - 1
    - 2
    - 8
    need_context: ~500M smallholder farms worldwide; the majority earn below a living income.
  - sector: agriculture
    metric_id: yield_increase_pct
    metric_label: Crop yield increase
    unit: '%'
    p25: 8.0
    p50: 18.0
    p75: 32.0
    p90: 50.0
    sample_size: 120
    sdg:
    - 2
    need_context: Smallholder yield gaps of 50%+ vs. potential are common.
  - sector: agriculture
    metric_id: income_increase_pct
    metric_label: Farmer income increase
    unit: '%'
    p25: 10.0
    p50: 22.0
    p75: 40.0
    p90: 65.0
    sample_size: 110
    sdg:
    - 1
    - 8
    need_context: Closing the smallholder living-income gap is a core SDG 1 target.
  - sector: energy
    metric_id: ghg_avoided_tco2e
    metric_label: GHG emissions avoided
    unit: tCO2e
    p25: 2000.0
    p50: 12000.0
    p75: 45000.0
    p90: 120000.0
    sample_size: 140
    sdg:
    - 7
    - 13
    need_context: Power sector is ~25% of global emissions; rapid decarbonisation required.
  - sector: energy
    metric_id: energy_access_people
    metric_label: People with new/improved energy access
    unit: people
    p25: 5000.0
    p50: 25000.0
    p75: 90000.0
    p90: 250000.0
    sample_size: 130
    sdg:
    - 7
    need_context: ~675M people still lack electricity access (SDG 7).
  - sector: energy
    metric_id: clean_energy_mwh
    metric_label: Clean energy generated
    unit: MWh
    p25: 3000.0
    p50: 15000.0
    p75: 60000.0
    p90: 180000.0
    sample_size: 120
    sdg:
    - 7
    - 13
    need_context: Tripling renewables capacity by 2030 is the global benchmark.
  - sector: financial services
    metric_id: active_clients
    metric_label: Active clients reached
    unit: clients
    p25: 5000.0
    p50: 30000.0
    p75: 120000.0
    p90: 400000.0
    sample_size: 200
    sdg:
    - 1
    - 8
    - 10
    need_context: ~1.4B adults remain unbanked (Global Findex).
  - sector: financial services
    metric_id: pct_women_clients
    metric_label: Share of women clients
    unit: '%'
    p25: 35.0
    p50: 52.0
    p75: 68.0
    p90: 80.0
    sample_size: 180
    sdg:
    - 5
    - 8
    need_context: Women are disproportionately financially excluded; gender gap persists.
  - sector: financial services
    metric_id: pct_rural_clients
    metric_label: Share of rural clients
    unit: '%'
    p25: 20.0
    p50: 40.0
    p75: 60.0
    p90: 78.0
    sample_size: 150
    sdg:
    - 8
    - 10
    need_context: Rural and last-mile populations face the largest access gaps.
  - sector: forestry
    metric_id: hectares_sustainable
    metric_label: Hectares under sustainable management
    unit: ha
    p25: 1000.0
    p50: 8000.0
    p75: 30000.0
    p90: 90000.0
    sample_size: 70
    sdg:
    - 13
    - 15
    need_context: Forests absorb ~16 Gt CO2/yr; sustainable management is critical for SDG 15.
  - sector: forestry
    metric_id: tco2e_sequestered
    metric_label: Carbon sequestered
    unit: tCO2e
    p25: 3000.0
    p50: 20000.0
    p75: 75000.0
    p90: 200000.0
    sample_size: 65
    sdg:
    - 13
    - 15
    need_context: Nature-based removals are a key net-zero lever.
  - sector: healthcare
    metric_id: patients_served
    metric_label: Patients / clients served
    unit: patients
    p25: 8000.0
    p50: 40000.0
    p75: 150000.0
    p90: 450000.0
    sample_size: 130
    sdg:
    - 3
    need_context: ~4.5B people lack full coverage of essential health services.
  - sector: healthcare
    metric_id: pct_low_income_patients
    metric_label: Share of low-income patients
    unit: '%'
    p25: 30.0
    p50: 50.0
    p75: 70.0
    p90: 85.0
    sample_size: 110
    sdg:
    - 1
    - 3
    - 10
    need_context: Reaching underserved, low-income populations is the SDG 3 equity test.
  - sector: education
    metric_id: students_reached
    metric_label: Learners reached
    unit: students
    p25: 2000.0
    p50: 12000.0
    p75: 45000.0
    p90: 120000.0
    sample_size: 95
    sdg:
    - 4
    - 5
    - 10
    need_context: ~244M children and youth are out of school; learning poverty remains high in LMICs.
  - sector: education
    metric_id: learning_gain_pct
    metric_label: Measured learning gain
    unit: '%'
    p25: 5.0
    p50: 12.0
    p75: 22.0
    p90: 35.0
    sample_size: 60
    sdg:
    - 4
    need_context: Learning-adjusted years of schooling lag years enrolled in many impact geographies.
  - sector: water
    metric_id: people_safe_water
    metric_label: People with new/improved safe water
    unit: people
    p25: 3000.0
    p50: 15000.0
    p75: 60000.0
    p90: 180000.0
    sample_size: 80
    sdg:
    - 6
    need_context: ~2.2B people lack safely managed drinking water (SDG 6).
  - sector: water
    metric_id: water_non_revenue_pct
    metric_label: Non-revenue water
    unit: '%'
    p25: 18.0
    p50: 28.0
    p75: 40.0
    p90: 55.0
    sample_size: 55
    sdg:
    - 6
    - 12
    need_context: Utility losses of 30%+ are common; lower is better.
    direction: lower_better
  - sector: housing
    metric_id: housing_units
    metric_label: Affordable / adequate housing units
    unit: units
    p25: 80.0
    p50: 400.0
    p75: 1500.0
    p90: 5000.0
    sample_size: 70
    sdg:
    - 1
    - 11
    need_context: The global affordable-housing gap is estimated in the hundreds of millions of units.
  - sector: housing
    metric_id: pct_affordable_units
    metric_label: Share of units below local affordability threshold
    unit: '%'
    p25: 40.0
    p50: 60.0
    p75: 80.0
    p90: 95.0
    sample_size: 65
    sdg:
    - 1
    - 11
    need_context: Additionality is the share that would not have been delivered at market rate.
  - sector: manufacturing
    metric_id: jobs_created
    metric_label: Direct jobs created / sustained
    unit: jobs
    p25: 40.0
    p50: 180.0
    p75: 600.0
    p90: 1800.0
    sample_size: 90
    sdg:
    - 8
    - 9
    need_context: Decent-work creation in manufacturing remains a core SDG 8 pathway in emerging markets.
  - sector: manufacturing
    metric_id: ghg_intensity_tco2e
    metric_label: GHG intensity
    unit: tCO2e / unit output
    p25: 0.4
    p50: 0.9
    p75: 1.8
    p90: 3.5
    sample_size: 70
    sdg:
    - 9
    - 12
    - 13
    need_context: Intensity reduction is the typical PE climate lever in manufacturing.
    direction: lower_better
  - sector: waste management
    metric_id: tonnes_diverted
    metric_label: Waste diverted from landfill
    unit: tonnes
    p25: 500.0
    p50: 4000.0
    p75: 18000.0
    p90: 50000.0
    sample_size: 50
    sdg:
    - 11
    - 12
    need_context: Landfill diversion and circular recovery are core SDG 12 metrics.
  - sector: waste management
    metric_id: recycling_rate_pct
    metric_label: Recycling / recovery rate
    unit: '%'
    p25: 15.0
    p50: 35.0
    p75: 55.0
    p90: 75.0
    sample_size: 45
    sdg:
    - 12
    need_context: Municipal recycling rates remain below 20% in many impact geographies.
  - sector: transport
    metric_id: passengers_served
    metric_label: Passengers / users served
    unit: people
    p25: 8000.0
    p50: 40000.0
    p75: 150000.0
    p90: 400000.0
    sample_size: 60
    sdg:
    - 9
    - 11
    need_context: Safe, affordable mobility is a core SDG 11 service gap.
  - sector: transport
    metric_id: ghg_avoided_tco2e
    metric_label: GHG emissions avoided vs baseline mode
    unit: tCO2e
    p25: 400.0
    p50: 2500.0
    p75: 12000.0
    p90: 40000.0
    sample_size: 55
    sdg:
    - 11
    - 13
    need_context: Mode shift and fleet efficiency are the usual climate claims in mobility.
