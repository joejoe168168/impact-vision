- standard_id: ESRS
  name: ESRS under the Omnibus I simplification (Directive (EU) 2026/470)
  version: 2026-omnibus-i
  status: under_revision
  effective_date: '2026-03-18'
  source_url: https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=OJ:L_202600470
  requirements_url: https://finance.ec.europa.eu/capital-markets-union-and-financial-markets/company-reporting-and-auditing/company-reporting/corporate-sustainability-reporting_en
  aliases:
  - Omnibus I
  - Amended ESRS
  - ESRS Omnibus
  - CSRD Omnibus
  scope:
  - double materiality
  - EU sustainability reporting
  - scope reduction
  notes: Omnibus I Directive (EU) 2026/470 entered into force 2026-03-18. CSRD mandatory scope narrowed to undertakings
    with >1,000 employees AND >EUR 450M net turnover (cumulative); listed-SME and most former Wave 2/3 entities
    out of scope; sector-specific ESRS removed. Member States transpose by 2027-03-19, applying from FY2027. The
    revised ESRS (Delegated Regulation (EU) 2026/1563, OJ 2026-09-21) enter into force 2026-11-10 and are mandatory
    for financial years beginning on or after 2027-01-01 (see ESRS_SIMPLIFIED_2026).
- standard_id: CSDDD
  name: Corporate Sustainability Due Diligence Directive (as amended by Omnibus I)
  version: 2026-omnibus-i
  effective_date: '2029-07-26'
  source_url: https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=OJ:L_202600470
  aliases:
  - CS3D
  - CSDDD
  - Corporate Sustainability Due Diligence
  scope:
  - human rights due diligence
  - environmental due diligence
  - value chain
  requirement_ids:
  - identify
  - prevent
  - mitigate
  - remediate
  - grievance
  - monitor
  notes: 'Amended by Omnibus I (Directive (EU) 2026/470). Application deferred to 2029-07-26 (MS transposition by
    2028-07-26). Scope narrowed to >5,000 employees + EUR 1.5B net worldwide turnover (non-EU: EUR 1.5B EU turnover).
    Climate transition-plan adoption obligation removed; EU-harmonised civil-liability regime removed (national
    law applies); penalties capped at 3% of net global turnover. HRDD/OECD-UNGP expectations remain a market/LP
    norm regardless of legal scope.'
- standard_id: ESRS_SIMPLIFIED_2026
  name: Revised ESRS (Commission Delegated Regulation (EU) 2026/1563)
  version: 2026-oj
  effective_date: '2027-01-01'
  source_url: https://eur-lex.europa.eu/eli/reg_del/2026/1563/oj
  aliases:
  - Revised ESRS
  - ESRS 2026
  - Simplified ESRS
  scope:
  - CSRD
  - double materiality
  - simplified datapoints
  notes: Published in the OJ 2026-09-21; in force 2026-11-10; mandatory for financial years beginning on or after
    2027-01-01. For FY2026 a reporter may use Set 1, Set 1 with reliefs, or the revised set and must say which.
    Removes more than 60% of mandatory datapoints. EFRAG's draft XBRL taxonomy is in consultation until 2026-11-11.
  last_verified: '2026-10-06'
