schema_version: 1
as_of: '2026-10-06'
source_note: 'Consultant regulatory workbench (v4 Track 9): per-jurisdiction framework list and obligation catalogue.
  Obligations may override as_of/source_url.'
jurisdictions:
- jurisdiction: EU
  source: European Commission / EUR-Lex
  frameworks:
  - SFDR
  - CSRD/ESRS
  - ISSB IFRS S1
  - ISSB IFRS S2
  - TCFD
  - CBAM
  - EUDR
  - EU Battery Regulation
  - ESPR
  obligations:
  - obligation_id: sfdr_article_classification
    framework: SFDR
    title: Article 6 / 8 / 9 classification
    summary: Classify the fund under SFDR Article 6, 8, or 9 and publish PAIs.
    recurrence: one_off
    owner_hint: compliance lead
  - obligation_id: sfdr_pai_statement
    framework: SFDR
    title: PAI statement
    summary: Annual Principal Adverse Impact statement with 14+9 indicators.
    owner_hint: ESG analyst
  - obligation_id: omnibus_scope_check
    framework: CSRD/ESRS (Omnibus I)
    title: CSRD scope determination (Omnibus I)
    summary: Confirm CSRD scope post-Omnibus I (>1,000 employees AND >€450M turnover). If out of scope, decide VSME
      voluntary reporting.
    recurrence: one_off
    owner_hint: compliance lead
  - obligation_id: csrd_double_materiality
    framework: CSRD/ESRS
    title: Double-materiality assessment
    summary: Impact + financial materiality workspace with assurance-ready evidence (in-scope undertakings; FY2027
      under simplified ESRS).
  - obligation_id: csddd_value_chain_dd
    framework: CSDDD (Omnibus I)
    title: Value-chain human-rights & environmental due diligence
    summary: HRDD per CSDDD as amended by Omnibus I (>5,000 employees + €1.5B turnover; applies 2029-07-26). Voluntary
      OECD/UNGP HRDD otherwise.
    owner_hint: ESG / legal
  - obligation_id: issb_s1_general
    framework: ISSB IFRS S1
    title: General sustainability disclosures
    summary: Governance, strategy, risk management, and metrics/targets.
  - obligation_id: issb_s2_climate
    framework: ISSB IFRS S2
    title: Climate-related disclosures
    summary: Scope 1/2/3, transition plan, climate scenario analysis.
  - obligation_id: cbam_annual_declaration
    framework: CBAM
    title: CBAM embedded-emissions declaration
    summary: Annual CBAM declaration with verified embedded emissions and certificate surrender for covered imports
      (cement, iron/steel, aluminium, fertilisers, hydrogen, electricity). Applies to portfolio companies importing
      covered goods into the EU above the de-minimis threshold.
    owner_hint: customs / ESG analyst
  - obligation_id: eudr_due_diligence_statement
    framework: EUDR
    title: EUDR deforestation due-diligence system review
    summary: Maintain a due-diligence system (geolocation, country risk, legality evidence) and file DDS for each
      placement of cattle, cocoa, coffee, palm oil, rubber, soy, or wood products on the EU market. Annual system
      review plus per-shipment statements.
    owner_hint: supply-chain / legal
  - obligation_id: battery_passport_readiness
    framework: EU Battery Regulation
    title: Battery passport & carbon-footprint readiness
    summary: Digital battery passport (EV/LMT/industrial >2 kWh) and phased carbon-footprint declarations under
      Regulation (EU) 2023/1542. Applies to portfolio companies placing covered batteries on the EU market.
    owner_hint: product compliance
  - obligation_id: espr_dpp_applicability
    framework: ESPR
    title: ESPR / Digital Product Passport applicability screen
    summary: Check delegated acts for covered product groups and prepare Digital Product Passport data fields (durability,
      recycled content, substances of concern) under Regulation (EU) 2024/1781.
    recurrence: one_off
    owner_hint: product compliance
  notes: EU CSRD + SFDR + ISSB baseline. Product/export-side obligations (CBAM, EUDR, Battery Regulation, ESPR)
    apply only where portfolio companies place covered goods on the EU market — screen applicability with the esg_toolbox
    or product_passport tools.
- jurisdiction: UK
  source: Financial Conduct Authority (FCA)
  frameworks:
  - FCA SDR
  - UK SRS (FCA PS26/19)
  - ISSB IFRS S1
  - ISSB IFRS S2
  - TCFD
  obligations:
  - obligation_id: sdr_label
    framework: FCA SDR
    title: SDR label selection
    summary: Select one of Sustainability Focus / Improvers / Impact / Mixed Goals and evidence anti-greenwashing.
    recurrence: one_off
  - obligation_id: sdr_disclosures
    framework: FCA SDR
    title: SDR disclosures
    summary: Consumer-facing and pre-contractual disclosures per SDR.
  - obligation_id: uk_srs_listed_issuers
    framework: UK SRS (FCA PS26/19)
    title: UK SRS statement (listed issuers, comply-or-explain)
    summary: 'Listed issuers report against UK SRS S1/S2 on a comply-or-explain basis for periods beginning on or
      after 2027-01-01 (first reports in 2028). Reliefs: Scope 3 for the first year; wider (non-climate) UK SRS
      S1 disclosures for the first two years. Transition-plan rules remain on the watch-list.'
    owner_hint: CFO / company secretary
    due_offset_days: 120
    as_of: '2026-10-06'
    source_url: https://www.fca.org.uk/publications/policy-statements/ps26-19-aligning-listed-issuers-sustainability-disclosures-international-standards
    last_verified: '2026-10-06'
  notes: UK SDR + UK SRS with a strong anti-greenwashing lens. UK SRS for listed issuers is comply-or-explain (FCA
    PS26/19, final 2026-09-30) for periods from 2027-01-01.
- jurisdiction: US
  source: California Air Resources Board / California legislature
  frameworks:
  - California SB 253/261
  - State climate rules
  - ISSB (voluntary)
  obligations:
  - obligation_id: ca_sb253_ghg_report
    framework: California SB 253
    title: California SB 253 GHG emissions report
    summary: Entities doing business in California with >$1B revenue must report Scope 1+2 GHG emissions annually
      (first report due 2026-11-10 after CARB's deferral; limited assurance waived for this first cycle); Scope
      3 phases in from 2027 with escalating assurance.
    owner_hint: ESG analyst
    fixed_due_date: '2026-11-10'
    as_of: '2026-10-06'
    source_url: https://ww2.arb.ca.gov/our-work/programs/california-corporate-greenhouse-gas-reporting
    last_verified: '2026-10-06'
  - obligation_id: ca_sb261_climate_risk
    framework: California SB 261
    title: California SB 261 climate-risk report (enforcement stayed)
    summary: 'Entities doing business in California with >$500M revenue: biennial TCFD-style climate-risk report.
      Enforcement is stayed by a Ninth Circuit injunction (as of mid-2026) — monitor the appeal.'
    owner_hint: ESG / legal
  notes: 'No federal climate-disclosure mandate: the SEC''s 2024 climate rule never took effect and the SEC formally
    proposed its rescission on 2026-05-29. California SB 253/261 (plus copycat state bills) are the operative US
    obligations; ISSB remains voluntary.'
- jurisdiction: Singapore
  source: SGX RegCo / ACRA
  frameworks:
  - MAS green taxonomy
  - ISSB IFRS S1
  - ISSB IFRS S2
  obligations:
  - obligation_id: sgx_climate
    framework: SGX climate disclosure
    title: SGX climate disclosure
    summary: Phased mandatory climate disclosure by sector.
- jurisdiction: Switzerland
  source: Swiss Federal Council
  frameworks:
  - Swiss climate ordinance
  - ISSB IFRS S1
  - ISSB IFRS S2
  obligations:
  - obligation_id: ch_climate_ordinance
    framework: Swiss climate ordinance
    title: Swiss climate disclosure
    summary: TCFD-aligned climate disclosure for large entities.
- jurisdiction: Canada
  source: CSSB / Canadian Securities Administrators
  frameworks:
  - CSSB (ISSB-aligned)
  - CSA climate rules
  obligations:
  - obligation_id: cssb_climate
    framework: CSSB / ISSB
    title: CSSB climate disclosure
    summary: ISSB-aligned Canadian sustainability standard.
- jurisdiction: Japan
  source: SSBJ / Financial Services Agency
  frameworks:
  - SSBJ (ISSB-aligned)
  - TCFD
  obligations:
  - obligation_id: ssbj_climate
    framework: SSBJ / ISSB
    title: SSBJ climate disclosure
    summary: Japanese SSBJ (ISSB-aligned) climate disclosure.
- jurisdiction: Australia
  source: AASB / ASIC
  frameworks:
  - AASB S2
  - ISSB IFRS S2
  obligations:
  - obligation_id: aasb_s2_climate
    framework: AASB S2
    title: AASB S2 climate disclosure
    summary: Mandatory climate reporting under AASB S2.
- jurisdiction: CN
  source: Shanghai and Shenzhen Stock Exchanges
  frameworks:
  - SSE Guideline No. 14
  - SZSE Sustainability Reporting Guidelines
  - Preparation Guides No. 1-3
  obligations:
  - obligation_id: cn_sustainability_report
    framework: SSE/SZSE
    title: Annual sustainability report
    summary: Mandatory issuers publish the prior-FY report by 30 April; Article 7 permits referenced disclosure
      with a clear index.
    owner_hint: board secretary / ESG lead
  notes: Guideline No. 14 effective 2024-05-01; preparation guides revised January 2026.
- jurisdiction: HK
  source: HKEX / HKMA / HKICPA
  frameworks:
  - HKEX climate requirements (IFRS S2-based)
  - HKFRS S1/S2 (ISSB)
  - Hong Kong Taxonomy for Sustainable Finance
  - HKSSA 5000
  obligations:
  - obligation_id: hkex_esg_climate_report
    framework: HKEX climate requirements
    title: HKEX ESG report with climate disclosures
    summary: Main Board issuers report climate disclosures under the IFRS S2-based HKEX requirements. LargeCap issuers
      (Hang Seng Composite LargeCap constituents) must report in full for financial years beginning on or after
      2026-01-01; other Main Board issuers comply-or-explain. Published with the annual report (within four months
      of year end).
    owner_hint: company secretary / ESG lead
    due_offset_days: 120
    as_of: '2026-10-06'
    source_url: https://sustainablefutures.linklaters.com/post/102l784/esg-quick-guide-hong-kong-sar-climate-disclosure-rules-under-hong-kong-listing
    last_verified: '2026-10-06'
  - obligation_id: hk_taxonomy_alignment
    framework: Hong Kong Taxonomy
    title: Hong Kong Taxonomy alignment screen
    summary: Voluntary alignment screen of activities against the HKMA Hong Kong Taxonomy (Phase 2A final 2026-01-22;
      Phase 2B prototype consultation closed 2026-10-07). Use the taxonomy screen for green-finance labelling.
    owner_hint: ESG analyst
    due_offset_days: 120
    as_of: '2026-10-06'
    source_url: https://www.hkma.gov.hk/eng/news-and-media/press-releases/2026/01/20260122-3/
    last_verified: '2026-10-06'
  - obligation_id: hkssa_5000_assurance_readiness
    framework: HKSSA 5000
    title: Sustainability assurance readiness (HKSSA 5000)
    summary: HKSSA 5000 replaces ISAE 3000/3410-based engagements for periods beginning on or after 2026-12-15.
      Prepare evidence, controls and a record of where AI was used for each assured figure.
    owner_hint: CFO / assurance provider
    due_offset_days: 150
    as_of: '2026-10-06'
    source_url: https://www.hkicpa.org.hk/-/media/HKICPA-Website/Members-Handbook/volumeIII/324ssa5.pdf
    last_verified: '2026-10-06'
  - obligation_id: hk_transition_plan
    framework: HKFRS S2 / TPT
    title: Climate transition plan (TPT / ISSB-aligned)
    summary: Disclose transition-plan information under IFRS S2 paragraph 14, using the TPT disclosure framework
      as the template. Full HKFRS S1/S2 for all listed issuers is expected from ~2028 after a 2027 consultation.
    owner_hint: ESG lead
    due_offset_days: 120
    as_of: '2026-10-06'
    last_verified: '2026-10-06'
  notes: 'Hong Kong: HKEX climate requirements are mandatory for LargeCap issuers from FY2026; HKFRS S1/S2 for all
    listed issuers targeted ~2028; HKSSA 5000 effective for periods beginning on/after 2026-12-15.'
