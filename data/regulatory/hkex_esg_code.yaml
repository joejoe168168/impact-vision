# HKEX ESG Reporting Code gap checklist — Main Board Listing Rules Appendix C2
# (GEM: Appendix C2 of the GEM Rules), as in force from 1 January 2025.
#
#   Part B  Mandatory disclosure requirements (paras 13–15)
#   Part C  "Comply or explain" provisions: environmental aspects A1–A3 and
#           social aspects B1–B8, each a General Disclosure plus KPIs.
#           KPI A1.2 (GHG emissions) and Aspect A4 (Climate Change) moved to Part D.
#   Part D  Climate-related disclosures modelled on IFRS S2
#
# Requirement wording follows HKEX, "Linking the ISSB Standards and HKEX ESG
# Reporting Code" (September 2025), which reproduces every Part B and Part C
# provision. Part D rows are grouped by the four IFRS S2 pillars; only the
# paragraph numbers HKEX cites there (19 governance, 37–40 targets) are given.
#
# `cues` are what a report that meets the provision usually says, in English and
# Traditional Chinese. A match is a pointer to check, not a compliance opinion.
schema_version: 1
as_of: "2026-11-10"
last_verified: "2026-11-10"
source: >-
  HKEX, Linking the ISSB Standards and HKEX ESG Reporting Code (September 2025);
  Main Board Listing Rules Appendix C2 (ESG Reporting Code), effective 2025-01-01
source_url: https://www.hkex.com.hk/-/media/HKEX-Market/Listing/Rules-and-Guidance/Environmental-Social-and-Governance/Exchanges-guidance-materials-on-ESG/ISSBstd_esgcode.pdf
cue_status: illustrative   # cue lists are heuristics; the provisions themselves are sourced

standard: "HKEX ESG Reporting Code (Listing Rules Appendix C2, effective 2025-01-01)"

# Who must do what, from when. `part_d` is the basis for the Part D rows that
# are not marked `mandatory_all`.
phasing:
  largecap:
    label: Hang Seng Composite LargeCap Index constituent
    zh: 恒生綜合大型股指數成份股發行人
    part_d: mandatory
    from: "2026-01-01"
    note: Part D is mandatory for financial years beginning on or after 2026-01-01.
  main_board:
    label: Main Board issuer
    zh: 主板發行人
    part_d: comply_or_explain
    from: "2025-01-01"
    note: Part D applies on a "comply or explain" basis for financial years beginning on or after 2025-01-01.
  gem:
    label: GEM issuer
    zh: GEM 發行人
    part_d: voluntary
    from: "2025-01-01"
    note: Part D is voluntary for GEM issuers, except Scope 1 and Scope 2 emissions.
scope12_note: >-
  Scope 1 and Scope 2 greenhouse gas emissions are a mandatory disclosure for all issuers for financial years
  beginning on or after 2025-01-01.
issb_note: >-
  A report prepared in accordance with IFRS S1 and IFRS S2 is considered to comply with Part D (ESG Code
  para 8). Parts B and C still apply.
outlook_note: >-
  HKEX has said it will consult in 2027 on mandating the HKFRS (ISSB-aligned) standards for listed publicly
  accountable entities, with an expected effective date of 2028-01-01. Run the HKFRS S1 gap check as well.

# A cue found in a sentence with one of these reads as "explained" rather than reported.
explain_markers:
  - '\bnot\s+(?:applicable|material|relevant)\b'
  - '\b(?:immaterial|insignificant)\b'
  - '\bno\s+(?:material|significant)\b'
  - '\bdoes\s+not\s+(?:involve|generate|produce|consume|use)\b'
  - '不適用'
  - '並不(?:重大|重要|適用|涉及)'
  - '(?:並無|沒有)(?:重大|產生|涉及)'
  - '不(?:屬|属)重大'

parts:
  B: {label: "Part B — Mandatory disclosure", zh: "B 部分 — 強制披露規定", basis: mandatory}
  C_env: {label: "Part C — Environmental (comply or explain)", zh: "C 部分 — 環境（不遵守就解釋）", basis: comply_or_explain}
  C_soc: {label: "Part C — Social (comply or explain)", zh: "C 部分 — 社會（不遵守就解釋）", basis: comply_or_explain}
  D: {label: "Part D — Climate-related disclosures", zh: "D 部分 — 氣候相關披露", basis: phased}

requirements:
  # ---------------------------------------------------------------- Part B
  - id: b13_oversight
    part: B
    ref: "para 13(i)"
    title: Board statement — the board's oversight of ESG issues
    zh: 董事會聲明 — 董事會對 ESG 事宜的監管
    cues: ['\bboard\b.{0,80}\b(?:oversee|oversight|overall responsibility|responsib)', '\b(?:esg|sustainab\w*)\s+committee\b', '董事會.{0,30}(?:監管|監察|監督|全面負責|整體責任)', '(?:ESG|環境、社會及管治|可持續發展).{0,6}委員會']
  - id: b13_approach
    part: B
    ref: "para 13(ii)"
    title: Board statement — ESG management approach and strategy, including how material ESG issues are evaluated, prioritised and managed
    zh: 董事會聲明 — ESG 管理方針及策略，包括評估、優次排列及管理重要 ESG 事宜的過程
    cues: ['\b(?:esg|sustainab\w*)\s+(?:management\s+approach|strategy|policy)\b', '\b(?:evaluat|prioriti[sz]|manag)\w*\b.{0,40}\bmaterial\b.{0,20}\b(?:esg|issues|topics)', '(?:ESG|環境、社會及管治|可持續發展).{0,6}(?:管理方針|策略|政策)', '(?:評估|優次|排序).{0,20}重要.{0,10}(?:事宜|議題)']
  - id: b13_progress
    part: B
    ref: "para 13(iii)"
    title: Board statement — how the board reviews progress against ESG goals and targets
    zh: 董事會聲明 — 董事會如何按 ESG 目標檢討進度
    cues: ['\bboard\b.{0,80}\b(?:review|monitor|track)\w*\b.{0,40}\b(?:progress|targets?|goals?)', '\bprogress\b.{0,40}\b(?:against|towards)\b.{0,30}\b(?:targets?|goals?)', '董事會.{0,30}(?:檢討|審視|監察).{0,20}(?:進度|目標)', '(?:目標|指標).{0,10}(?:進度|進展)']
  - id: b14_materiality
    part: B
    ref: "para 14 — Materiality"
    title: Reporting principle Materiality — how material ESG factors were identified and selected; stakeholder engagement and its results
    zh: 匯報原則「重要性」— 識別及選擇重要 ESG 因素的過程及準則；持份者參與及結果
    cues: ['\bmateriality\s+(?:assessment|analysis|matrix)\b', '\bmaterial\s+(?:esg\s+)?(?:topics|issues|factors)\b', '\bstakeholder\s+engagement\b', '重要性(?:評估|分析|矩陣)', '重要(?:議題|範疇|事宜)', '持份者(?:參與|溝通)', '利益相關方(?:參與|溝通)']
  - id: b14_quantitative
    part: B
    ref: "para 14 — Quantitative"
    title: Reporting principle Quantitative — standards, methodologies, assumptions, calculation tools and conversion-factor sources for emissions and energy
    zh: 匯報原則「量化」— 排放量及能源耗用所用的標準、方法、假設、計算工具及轉換因素來源
    cues: ['\b(?:emission|conversion)\s+factors?\b', '\bcalculat\w+\b.{0,50}\b(?:methodolog|standard|ghg protocol|iso\s?14064)', '\bghg protocol\b', '(?:排放|轉換)(?:因子|系數|係數|因素)', '(?:計算|量化).{0,20}(?:方法|標準|假設)', '溫室氣體核算體系']
  - id: b14_consistency
    part: B
    ref: "para 14 — Consistency"
    title: Reporting principle Consistency — any change to methods or KPIs that affects comparison
    zh: 匯報原則「一致性」— 影響比較的方法或關鍵績效指標變更
    cues: ['\bconsisten(?:t|cy)\b.{0,60}\b(?:method|approach|prior|previous|comparison|year)', '\b(?:restat|recalculat)\w+', '\bno\s+(?:significant\s+)?changes?\b.{0,40}\b(?:method|kpi|scope)', '一致性', '(?:方法|指標).{0,10}(?:變更|變動|更改)', '重列']
  - id: b15_boundary
    part: B
    ref: "para 15"
    title: Reporting boundary — which entities and operations are covered, how they were chosen, and any change in scope
    zh: 匯報範圍 — 涵蓋哪些實體或業務、如何釐定，以及範圍變更
    cues: ['\breporting\s+(?:boundar(?:y|ies)|scope)\b', '\bscope\s+of\s+(?:this|the)\s+report\b', '\bthis\s+report\s+covers\b', '(?:匯報|報告)(?:範圍|邊界)', '本報告涵蓋']

  # ------------------------------------------------------ Part C, environmental
  - id: a1_gd
    part: C_env
    aspect: A1
    ref: "Aspect A1 — General Disclosure"
    title: Emissions — policies and compliance with laws on air and GHG emissions, discharges into water and land, and waste
    zh: 排放物 — 有關廢氣及溫室氣體排放、向水及土地的排污、廢棄物的政策及遵守法規情況
    cues: ['\b(?:emissions?|waste|discharge)\b.{0,60}\b(?:polic|laws?\b|regulations?\b|ordinance)', '\b(?:air pollution control|waste disposal|water pollution control)\s+ordinance\b', '(?:排放|廢棄物|污水).{0,30}(?:政策|法律|法規|條例)', '(?:空氣污染管制|廢物處置|水污染管制)條例']
  - id: a1_1
    part: C_env
    aspect: A1
    ref: "KPI A1.1"
    title: Types of emissions and respective emissions data
    zh: 排放物種類及相關排放數據
    cues: ['\b(?:nox|sox|nitrogen oxides?|sulphur oxides?|sulfur oxides?|particulate matter|pm2\.?5|pm10)\b', '\bair\s+emissions?\b', '(?:氮氧化物|硫氧化物|懸浮粒子|顆粒物)', '廢氣排放']
  - id: a1_3
    part: C_env
    aspect: A1
    ref: "KPI A1.3"
    title: Total hazardous waste produced (tonnes) and, where appropriate, intensity
    zh: 所產生有害廢棄物總量（以噸計算）及（如適用）密度
    cues: ['(?<!non-)(?<!non )\bhazardous\s+waste\b', '(?<!無)(?<!无)有害廢棄物', '危險廢物']
  - id: a1_4
    part: C_env
    aspect: A1
    ref: "KPI A1.4"
    title: Total non-hazardous waste produced (tonnes) and, where appropriate, intensity
    zh: 所產生無害廢棄物總量（以噸計算）及（如適用）密度
    cues: ['\bnon[-\s]hazardous\s+waste\b', '\bgeneral\s+waste\b', '無害廢棄物', '一般廢物']
  - id: a1_5
    part: C_env
    aspect: A1
    ref: "KPI A1.5"
    title: Emission target(s) set and steps taken to achieve them
    zh: 所訂立的排放量目標及為達到這些目標所採取的步驟
    cues: ['\b(?:emissions?|carbon|ghg)\b.{0,30}\b(?:reduction\s+)?targets?\b', '\breduce\b.{0,40}\bemissions?\b.{0,40}\bby\s+20[2-5]\d', '\bnet[-\s]zero\b', '(?:排放|減排|減碳).{0,12}目標', '淨零']
  - id: a1_6
    part: C_env
    aspect: A1
    ref: "KPI A1.6"
    title: How hazardous and non-hazardous wastes are handled, reduction target(s) and steps taken
    zh: 處理有害及無害廢棄物的方法，以及所訂立的減廢目標及所採取的步驟
    cues: ['\bwaste\b.{0,40}\b(?:handl|treat|dispos|recycl|collect)\w+', '\bwaste\s+(?:reduction|diversion)\b.{0,30}\btargets?\b', '\bwaste\s+management\b', '廢棄物.{0,12}(?:處理|回收|處置)', '減廢.{0,6}目標', '廢物管理']
  - id: a2_gd
    part: C_env
    aspect: A2
    ref: "Aspect A2 — General Disclosure"
    title: Use of resources — policies on the efficient use of energy, water and other raw materials
    zh: 資源使用 — 有效使用資源（包括能源、水及其他原材料）的政策
    cues: ['\b(?:efficient|efficiency)\b.{0,40}\b(?:use\s+of\s+)?(?:resources|energy|water|materials)\b', '\bresource\s+(?:efficiency|conservation|management)\b', '(?:資源|能源|水).{0,10}(?:使用效益|效益|節約|管理).{0,10}政策', '(?:節約|有效使用)(?:資源|能源|用水)']
  - id: a2_1
    part: C_env
    aspect: A2
    ref: "KPI A2.1"
    title: Direct and/or indirect energy consumption by type, in total (kWh in '000s) and intensity
    zh: 按類型劃分的直接及／或間接能源總耗量（以千個千瓦時計算）及密度
    cues: ['\benergy\s+consumption\b', '\b(?:electricity|diesel|petrol|gas|fuel)\s+consum', '\b(?:kwh|mwh|gwh)\b', '能源(?:總)?(?:耗量|消耗|用量)', '(?:耗電量|用電量)', '千瓦時']
  - id: a2_2
    part: C_env
    aspect: A2
    ref: "KPI A2.2"
    title: Water consumption in total and intensity
    zh: 總耗水量及密度
    cues: ['\bwater\s+(?:consumption|usage|withdrawal|use)\b', '\b(?:cubic\s+met(?:re|er)s?|m3|m³)\b', '(?:耗水量|用水量|總耗水)', '立方米']
  - id: a2_3
    part: C_env
    aspect: A2
    ref: "KPI A2.3"
    title: Energy use efficiency target(s) set and steps taken to achieve them
    zh: 所訂立的能源使用效益目標及為達到這些目標所採取的步驟
    cues: ['\benergy\b.{0,30}\b(?:efficiency|saving|reduction|intensity)\b.{0,30}\btargets?\b', '\breduce\b.{0,30}\b(?:energy|electricity)\b.{0,40}\bby\s+(?:\d|20[2-5]\d)', '能源.{0,10}(?:效益|節約|減少).{0,10}目標', '節能目標']
  - id: a2_4
    part: C_env
    aspect: A2
    ref: "KPI A2.4"
    title: Any issue in sourcing water fit for purpose; water efficiency target(s) and steps taken
    zh: 求取適用水源上可有任何問題，以及所訂立的用水效益目標及所採取的步驟
    cues: ['\bsourc\w+\b.{0,30}\bwater\b', '\bwater\b.{0,30}\b(?:efficiency|saving|reduction|intensity)\b.{0,30}\btargets?\b', '(?:求取|獲取).{0,6}(?:適用)?水源', '(?:用水|節水).{0,10}(?:效益)?目標']
  - id: a2_5
    part: C_env
    aspect: A2
    ref: "KPI A2.5"
    title: Total packaging material used for finished products (tonnes) and, if applicable, per unit produced
    zh: 製成品所用包裝材料的總量（以噸計算）及（如適用）每生產單位佔量
    cues: ['\bpackaging\s+materials?\b', '\bpackaging\b.{0,30}\b(?:tonnes?|kg|used|consum)', '包裝(?:材料|物料)']
  - id: a3_gd
    part: C_env
    aspect: A3
    ref: "Aspect A3 — General Disclosure"
    title: Environment and natural resources — policies on minimising the issuer's significant impacts
    zh: 環境及天然資源 — 減低發行人對環境及天然資源造成重大影響的政策
    cues: ['\b(?:environment(?:al)?|natural\s+resources)\b.{0,50}\b(?:polic|minimi[sz]|reduc)\w*\b.{0,30}\bimpacts?\b', '\benvironmental\s+(?:policy|management\s+system)\b', '\biso\s?14001\b', '(?:環境|天然資源).{0,20}(?:影響).{0,10}政策', '環境(?:政策|管理體系)']
  - id: a3_1
    part: C_env
    aspect: A3
    ref: "KPI A3.1"
    title: Significant impacts of activities on the environment and natural resources, and actions taken to manage them
    zh: 業務活動對環境及天然資源的重大影響及已採取管理有關影響的行動
    cues: ['\b(?:significant|material)\s+impacts?\b.{0,50}\b(?:environment|natural\s+resources|biodiversity)', '\b(?:biodiversity|ecosystems?|habitat|land\s+use)\b', '對環境.{0,12}(?:重大)?影響', '(?:生物多樣性|生態系統|天然資源)']

  # ------------------------------------------------------------ Part C, social
  - id: b1_gd
    part: C_soc
    aspect: B1
    ref: "Aspect B1 — General Disclosure"
    title: Employment — policies and legal compliance on pay and dismissal, recruitment and promotion, working hours, rest, equal opportunity, diversity, anti-discrimination and welfare
    zh: 僱傭 — 有關薪酬及解僱、招聘及晉升、工作時數、假期、平等機會、多元化、反歧視及其他待遇及福利的政策及遵守法規情況
    cues: ['\b(?:recruitment|promotion|dismissal|compensation|working\s+hours|rest\s+periods)\b', '\b(?:equal\s+opportunit|anti[-\s]discrimination|diversity)', '\bemployment\s+ordinance\b', '(?:招聘|晉升|解僱|薪酬|工作時數)', '(?:平等機會|反歧視|多元化)', '僱傭條例']
  - id: b1_1
    part: C_soc
    aspect: B1
    ref: "KPI B1.1"
    title: Total workforce by gender, employment type, age group and geographical region
    zh: 按性別、僱傭類型、年齡組別及地區劃分的僱員總數
    cues: ['\b(?:workforce|employees|headcount)\b.{0,50}\bby\s+(?:gender|age|employment\s+type|region|geograph)', '\b(?:full[-\s]time|part[-\s]time)\b.{0,40}\b(?:employees|staff)\b', '按(?:性別|年齡|僱傭類型|地區).{0,20}(?:僱員|員工)', '(?:全職|兼職)(?:僱員|員工)']
  - id: b1_2
    part: C_soc
    aspect: B1
    ref: "KPI B1.2"
    title: Employee turnover rate by gender, age group and geographical region
    zh: 按性別、年齡組別及地區劃分的僱員流失比率
    cues: ['\b(?:employee\s+|staff\s+)?turnover\s+rate\b', '\battrition\s+rate\b', '(?:僱員|員工)?流失(?:比率|率)']
  - id: b2_gd
    part: C_soc
    aspect: B2
    ref: "Aspect B2 — General Disclosure"
    title: Health and safety — policies and legal compliance on a safe working environment and protection from occupational hazards
    zh: 健康與安全 — 有關提供安全工作環境及保障僱員避免職業性危害的政策及遵守法規情況
    cues: ['\boccupational\s+(?:health|safety|hazards?)\b', '\bsafe\s+work(?:ing)?\s+(?:environment|place)\b', '\biso\s?45001\b', '職業(?:健康|安全|性危害)', '安全(?:的)?工作環境']
  - id: b2_1
    part: C_soc
    aspect: B2
    ref: "KPI B2.1"
    title: Number and rate of work-related fatalities in each of the past three years including the reporting year
    zh: 過去三年（包括匯報年度）每年因工亡故的人數及比率
    cues: ['\bwork[-\s]related\s+(?:fatalit|deaths?)', '\bfatalit(?:y|ies)\b', '因工(?:亡故|死亡)', '工傷死亡']
  - id: b2_2
    part: C_soc
    aspect: B2
    ref: "KPI B2.2"
    title: Lost days due to work injury
    zh: 因工傷損失工作日數
    cues: ['\blost\s+(?:days|time)\b', '\bwork(?:[-\s]related)?\s+injur', '\bltifr\b', '(?:因工傷)?損失工作日', '工傷']
  - id: b2_3
    part: C_soc
    aspect: B2
    ref: "KPI B2.3"
    title: Occupational health and safety measures adopted, and how they are implemented and monitored
    zh: 所採納的職業健康與安全措施，以及相關執行及監察方法
    cues: ['\b(?:health\s+and\s+safety|safety|ohs|ehs)\s+(?:measures|training|inspections?|drills?|audits?|committee)\b', '\bpersonal\s+protective\s+equipment\b', '(?:安全|職安健).{0,6}(?:措施|培訓|巡查|演習|委員會)', '個人防護裝備']
  - id: b3_gd
    part: C_soc
    aspect: B3
    ref: "Aspect B3 — General Disclosure"
    title: Development and training — policies on improving employees' knowledge and skills; description of training activities
    zh: 發展及培訓 — 有關提升僱員履行工作職責的知識及技能的政策；描述培訓活動
    cues: ['\btraining\s+(?:programmes?|programs?|activities|courses|polic)\w*', '\b(?:career|professional|staff|employee)\s+development\b', '培訓(?:活動|課程|計劃|政策)', '(?:僱員|員工|專業)發展']
  - id: b3_1
    part: C_soc
    aspect: B3
    ref: "KPI B3.1"
    title: Percentage of employees trained by gender and employee category
    zh: 按性別及僱員類別劃分的受訓僱員百分比
    cues: ['\b(?:percentage|proportion|%)\s+of\s+(?:employees|staff)\s+trained\b', '\bemployees\s+trained\b.{0,30}\bby\s+(?:gender|category|grade)', '受訓(?:僱員|員工)(?:百分比|比例)']
  - id: b3_2
    part: C_soc
    aspect: B3
    ref: "KPI B3.2"
    title: Average training hours completed per employee by gender and employee category
    zh: 按性別及僱員類別劃分，每名僱員完成受訓的平均時數
    cues: ['\baverage\s+training\s+hours\b', '\btraining\s+hours\s+per\s+employee\b', '平均(?:受訓|培訓)時數']
  - id: b4_gd
    part: C_soc
    aspect: B4
    ref: "Aspect B4 — General Disclosure"
    title: Labour standards — policies and legal compliance on preventing child and forced labour
    zh: 勞工準則 — 有關防止童工或強制勞工的政策及遵守法規情況
    cues: ['\b(?:child|forced|compulsory)\s+labou?r\b', '\bmodern\s+slavery\b', '(?:童工|強制勞工|強迫勞動)']
  - id: b4_1
    part: C_soc
    aspect: B4
    ref: "KPI B4.1"
