as_of: '2026-10-09'
source: Impact Vision; zh-CN derived from zh-HK with OpenCC hk2s plus a mainland vocabulary pass
status: machine-assisted; native-speaker review recommended before external use
patterns:
- en: '^Coverage is below 30% of the core metric set\. Start with: (?P<m>.+?)\.?$'
  zh-HK: 核心指標覆蓋率低於 30%。先從以下指標開始：{m}。
  zh-CN: 核心指标覆盖率低于 30%。先从以下指标开始：{m}。
- en: ^Coverage is below 60%\. Focus on closing gaps in the IRIS\+ Core Metric Set to achieve baseline compliance\.$
  zh-HK: 覆蓋率低於 60%。請優先填補 IRIS+ 核心指標集的缺口，以達到基本要求。
  zh-CN: 覆盖率低于 60%。请优先填补 IRIS+ 核心指标集的缺口，以达到基本要求。
- en: ^Good progress\. Target 80%\+ coverage by adding the remaining metrics\.$
  zh-HK: 進展良好。補充其餘指標，目標覆蓋率達 80% 以上。
  zh-CN: 进展良好。补充其余指标，目标覆盖率达 80% 以上。
- en: '^Measure HOW MUCH: .*$'
  zh-HK: 量度「多少」：追蹤規模（受惠人數）、深度（改變程度）及持續時間。
  zh-CN: 衡量“多少”：追踪规模（受益人数）、深度（改变程度）及持续时间。
- en: '^Assess CONTRIBUTION: .*$'
  zh-HK: 評估「貢獻」：建立反事實或基準比較。
  zh-CN: 评估“贡献”：建立反事实或基准比较。
- en: '^Evaluate RISK: .*$'
  zh-HK: 評估「風險」：評估證據風險、執行風險及外部風險因素。
  zh-CN: 评估“风险”：评估证据风险、执行风险及外部风险因素。
- en: '^Strengthen outcome measurement: .*$'
  zh-HK: 加強成果量度：以具體指標界定你所貢獻的成果（「甚麼」）。
  zh-CN: 加强成果衡量：以具体指标界定你所贡献的成果（“什么”）。
- en: '^Define WHO: .*$'
  zh-HK: 界定「誰」：列明目標人口、地域及持份者特徵。
  zh-CN: 界定“谁”：列明目标人口、地域及利益相关方特征。
- en: ^Map each SDG claim to at least one IRIS\+ metric with reported data$
  zh-HK: 將每項可持續發展目標聲明對應至最少一項有報告數據的 IRIS+ 指標。
  zh-CN: 将每项可持续发展目标声明对应到至少一项有报告数据的 IRIS+ 指标。
- en: ^Report the negative impacts that matter for this business, e\.g\. (?P<m>.+)$
  zh-HK: 報告與此業務相關的負面影響，例如：{m}
  zh-CN: 报告与此业务相关的负面影响，例如：{m}
- en: ^Report the negative impacts that matter for (?P<sector>.+?), e\.g\. (?P<m>.+)$
  zh-HK: 報告與{sector:sector}相關的負面影響，例如：{m}
  zh-CN: 报告与{sector:sector}相关的负面影响，例如：{m}
- en: ^Include risk-oriented and negative-impact metrics alongside positive outcomes$
  zh-HK: 在正面成果以外，同時報告風險及負面影響指標。
  zh-CN: 在正面成果以外，同时报告风险及负面影响指标。
- en: ^Report (?P<m>.+) to strengthen SDG (?P<g>\d+) evidence \((?P<x>\d+)/(?P<n>\d+) currently tracked\)$
  zh-HK: 報告 {m}，以加強可持續發展目標 {g} 的證據（目前追蹤 {x}/{n}）。
  zh-CN: 报告 {m}，以加强可持续发展目标 {g} 的证据（目前追踪 {x}/{n}）。
- en: '^Add impact themes: (?P<t>.+)$'
  zh-HK: 加入影響主題：{t}
  zh-CN: 加入影响主题：{t}
- en: ^Add specific outcome descriptions related to \"(?P<g>.+)\" targets in company documentation$
  zh-HK: 在公司文件中加入與「{g}」目標相關的具體成果描述。
  zh-CN: 在公司文件中加入与“{g}”目标相关的具体成果描述。
- en: '^Priority missing metrics: (?P<m>.+)$'
  zh-HK: 優先補充的指標：{m}
  zh-CN: 优先补充的指标：{m}
- en: ^Obtain third-party verification or implement a recognized measurement framework$
  zh-HK: 取得第三方核實，或採用公認的量度框架。
  zh-CN: 取得第三方核实，或采用公认的衡量框架。
- en: ^Report at least (?P<n>\d+) IRIS\+ metrics to unlock scores above (?P<s>[\d.]+) \(currently reporting (?P<c>\d+)\)$
  zh-HK: 至少報告 {n} 項 IRIS+ 指標，評分才可高於 {s}（目前報告 {c} 項）。
  zh-CN: 至少报告 {n} 项 IRIS+ 指标，评分才可高于 {s}（目前报告 {c} 项）。
- en: ^Start tracking IRIS\+ metrics to strengthen evidence and move beyond estimated scores$
  zh-HK: 開始追蹤 IRIS+ 指標，以加強證據並以實際數據取代估算評分。
  zh-CN: 开始追踪 IRIS+ 指标，以加强证据并以实际数据取代估算评分。
- en: ^Replace aspirational language with concrete, quantified outcome statements$
  zh-HK: 以具體、量化的成果陳述取代願景式用語。
  zh-CN: 以具体、量化的成果陈述取代愿景式用语。
- en: ^Replace generic wording with a specific, quantified claim, or cite an EN ISO 14024 ecolabel$
  zh-HK: 以具體、量化的聲明取代籠統用語，或引用 EN ISO 14024 環保標籤。
  zh-CN: 以具体、量化的声明取代笼统用语，或引用 EN ISO 14024 环保标签。
- en: ^Drop product-level neutrality claims that rely on credits; report reductions and credits separately$
  zh-HK: 刪除依賴碳信用的產品層面中和聲明；分開報告減排量及碳信用。
  zh-CN: 删除依赖碳信用的产品层面中和声明；分开报告减排量及碳信用。
- en: ^Demonstrate primary emission reductions before referencing offsets$
  zh-HK: 先證明實際減排，才引用抵銷。
  zh-CN: 先证明实际减排，才引用抵销。
- en: ^Publish the implementation plan with interim targets and an independent monitor$
  zh-HK: 公布實施計劃，包括中期目標及獨立監察機構。
  zh-CN: 公布实施计划，包括中期目标及独立监察机构。
- en: ^Commission a life-cycle assessment covering the full product/service life cycle$
  zh-HK: 委託進行涵蓋產品／服務整個生命周期的生命周期評估。
  zh-CN: 委托进行涵盖产品／服务整个生命周期的生命周期评估。
- en: ^Engage an independent verifier to substantiate environmental claims$
  zh-HK: 委聘獨立核實機構證明環保聲明。
  zh-CN: 委聘独立核实机构证明环保声明。
- en: ^(?P<p>\d+)% of core metrics reported \(needs (?P<n>\d+)%\)$
  zh-HK: 已報告 {p}% 核心指標（需要 {n}%）
  zh-CN: 已报告 {p}% 核心指标（需要 {n}%）
- en: ^evidence quality (?P<l>\w+) \((?P<s>\d+)/100, needs (?P<n>\d+)\)$
  zh-HK: 證據質素{l:eq}（{s}/100，需要 {n}）
  zh-CN: 证据质量{l:eq}（{s}/100，需要 {n}）
- en: ^no quantified outcome$
  zh-HK: 沒有量化成果
  zh-CN: 没有量化成果
- en: ^evidence quality (?P<l>\w+) \((?P<s>\d+)/100\)$
  zh-HK: 證據質素{l:eq}（{s}/100）
  zh-CN: 证据质量{l:eq}（{s}/100）
- en: '^the headline figure is at evidence level (?P<l>\d) \(needs (?P<n>\d): data showing change\)$'
  zh-HK: 主要數字的證據等級為 {l}（需要 {n}：顯示轉變的數據）
  zh-CN: 主要数字的证据等级为 {l}（需要 {n}：显示转变的数据）
- en: ^the range is too wide to decide on \(x(?P<s>[\d.]+) from P10 to P90, needs x(?P<n>[\d.]+) or less\)$
  zh-HK: 範圍太闊，難以作出決定（P10 至 P90 相差 {s} 倍，需要 {n} 倍或以下）
  zh-CN: 范围太宽，难以作出决定（P10 至 P90 相差 {s} 倍，需要 {n} 倍或以下）
- en: ^Ready, with (?P<p>\d+)% of the core metric set reported\.$
  zh-HK: 可提交投委會，核心指標集已報告 {p}%。
  zh-CN: 可提交投委会，核心指标集已报告 {p}%。
- en: ^(?P<n>\d+) claims likely misleading \(claim-level greenwashing (?P<s>\d+)/100\)$
  zh-HK: '{n} 項聲明可能具誤導性（聲明層面漂綠風險 {s}/100）'
  zh-CN: '{n} 项声明可能具误导性（声明层面漂绿风险 {s}/100）'
- en: '^greenwashing finding \((?P<s>\d+)/100: (?P<c>.+)\)$'
  zh-HK: 漂綠發現（{s}/100：{c:gwc}）
  zh-CN: 漂绿发现（{s}/100：{c:gwc}）
- en: ^people impact P50 (?P<n>[\d,]+) (?P<u>.+)$
  zh-HK: 對人的影響 P50 {n} {u:unit}
  zh-CN: 对人的影响 P50 {n} {u:unit}
- en: ^climate impact P50 (?P<n>[\d,]+) (?P<u>.+)$
  zh-HK: 氣候影響 P50 {n} {u:unit}
  zh-CN: 气候影响 P50 {n} {u:unit}
- en: '^Report progress against the company''s own target: (?P<q>“.+”)$'
  zh-HK: 按公司自訂的目標匯報進度：{q}
  zh-CN: 按公司自订的目标汇报进度：{q}
- en: '^Report the sector''s core metrics: (?P<m>.+?)\.?$'
  zh-HK: 報告行業核心指標：{m}。
  zh-CN: 报告行业核心指标：{m}。
- en: ^Report the sector's core metrics\.$
  zh-HK: 報告行業核心指標。
  zh-CN: 报告行业核心指标。
- en: ^Only (?P<p>\d+)% of the core set is reported\.$
  zh-HK: 只報告了 {p}% 核心指標。
  zh-CN: 只报告了 {p}% 核心指标。
- en: ^Have the headline reach figure \((?P<n>[\d,]+) (?P<who>.+)\) verified by a third party\.$
  zh-HK: 由第三方核實主要覆蓋數字（{n} 名{who:who}）。
  zh-CN: 由第三方核实主要覆盖数字（{n} 名{who:who}）。
- en: ^Reach drives most of the remaining uncertainty\.$
  zh-HK: 覆蓋人數是餘下不確定性的主要來源。
  zh-CN: 覆盖人数是余下不确定性的主要来源。
- en: '^Check the reach figure: (?P<n>[\d,]+) (?P<who>.+) is more than the population of (?P<place>.+) \((?P<pop>[\d,]+)\)\.$'
  zh-HK: 核對覆蓋數字：{n} 名{who:who}多於{place}的人口（{pop}）。
  zh-CN: 核对覆盖数字：{n} 名{who:who}多于{place}的人口（{pop}）。
- en: '^Check the emissions figure: (?P<n>[\d,]+) tCO2e against a US\$(?P<ask>[\d,]+) raise is (?P<x>[\d,]+) tonnes per US\$1m\.$'
  zh-HK: 核對排放數字：以 {ask} 美元的融資額計，{n} 噸二氧化碳當量相當於每百萬美元 {x} 噸。
  zh-CN: 核对排放数字：以 {ask} 美元的融资额计，{n} 吨二氧化碳当量相当于每百万美元 {x} 吨。
- en: ^Say what the (?P<p>[\d,]+)% change is a percentage of; the calculation counts it as 100%\.$
  zh-HK: 說明 {p}% 的改變以甚麼為基數；計算中按 100% 處理。
  zh-CN: 说明 {p}% 的改变以什么为基数；计算中按 100% 处理。
- en: ^A figure that cannot be right makes every number built on it unreliable\.$
  zh-HK: 不可能正確的數字，會令所有以此為基礎的數字變得不可靠。
  zh-CN: 不可能正确的数字，会令所有以此为基础的数字变得不可靠。
- en: '^Reconcile the two figures given for (?P<m>.+): (?P<a>.+) and (?P<b>.+)\.$'
  zh-HK: 查明「{m}」兩個數字何者正確：{a} 與 {b}。
  zh-CN: 查明“{m}”两个数字何者正确：{a} 与 {b}。
- en: ^The documents disagree by (?P<p>\d+)%, so every number built on this one is in doubt\.$
  zh-HK: 文件中的數字相差 {p}%，所有以此為基礎的數字均存疑。
  zh-CN: 文件中的数字相差 {p}%，所有以此为基础的数字均存疑。
- en: '^Back the main figures with data: monitoring records, surveys or audited accounts\.$'
  zh-HK: 以數據支持主要數字：監察紀錄、調查或經審核賬目。
  zh-CN: 以数据支持主要数字：监察记录、调查或经审核账目。
- en: ^Evidence quality is (?P<l>\w+) \((?P<s>\d+)/100\)\.$
  zh-HK: 證據質素{l:eq}（{s}/100）。
  zh-CN: 证据质量{l:eq}（{s}/100）。
- en: ^Compare with a group that did not get the product .*$
  zh-HK: 與沒有使用產品的群組比較（對照組或可信的基線），最好由獨立機構進行。
  zh-CN: 与没有使用产品的群组比较（对照组或可信的基线），最好由独立机构进行。
- en: ^Moves evidence from level (?P<a>\d) to 3, nets out deadweight and narrows the range \(now ×(?P<x>[\d.]+) from P10 to P90\)\.$
  zh-HK: 把證據由第 {a} 級提升至第 3 級，扣除本來會發生的部分並收窄範圍（目前 P90 為 P10 的 {x} 倍）。
  zh-CN: 把证据由第 {a} 级提升至第 3 级，扣除本来会发生的部分并收窄范围（目前 P90 为 P10 的 {x} 倍）。
- en: ^Moves evidence from level (?P<a>\d) to 3\.$
  zh-HK: 把證據由第 {a} 級提升至第 3 級。
  zh-CN: 把证据由第 {a} 级提升至第 3 级。
- en: ^Measure how much life changes for the (?P<who>.+?) \(before/after .*\)\.$
  zh-HK: 量度{who:who}的生活改變了多少（就重要成果作前後比較，例如收入、開支、健康或學習）。
  zh-CN: 衡量{who:who}的生活改变了多少（就重要成果作前后比较，例如收入、开支、健康或学习）。
- en: ^Depth of change is assumed, and it carries (?P<p>\d+)% of the uncertainty\.$
  zh-HK: 改變深度屬假設，佔不確定性的 {p}%。
  zh-CN: 改变深度属假设，占不确定性的 {p}%。
- en: ^State how many people \(or tonnes of CO2e\) the business reached in the last 12 months\.$
  zh-HK: 列明過去 12 個月業務惠及多少人（或減少多少噸二氧化碳當量）。
  zh-CN: 列明过去 12 个月业务惠及多少人（或减少多少吨二氧化碳当量）。
- en: ^No quantified outcome was found, so expected impact can't be estimated\.$
  zh-HK: 文件中沒有量化成果，因此無法估算預期影響。
  zh-CN: 文件中没有量化成果，因此无法估算预期影响。
- en: '^Show how you manage: (?P<i>.+) \(affects (?P<who>.+)\)\.$'
  zh-HK: 說明如何管理：{i:neg}（影響{who:who}）。
  zh-CN: 说明如何管理：{i:neg}（影响{who:who}）。
- en: ^Material negative impact \(severity (?P<s>\d) × likelihood (?P<l>\d)\) with no control described in the documents\.$
  zh-HK: 重要負面影響（嚴重程度 {s} × 可能性 {l}），文件中沒有描述控制措施。
  zh-CN: 重要负面影响（严重程度 {s} × 可能性 {l}），文件中没有描述控制措施。
- en: ^(?P<w>vague|mixed|concrete|buzzword only) wording$
  zh-HK: '{w:wording}'
  zh-CN: '{w:wording}'
- en: ^NESTA (?P<n>\d)(?P<v>, verified)?$
  zh-HK: NESTA {n}{v:verified}
  zh-CN: NESTA {n}{v:verified}
- en: ^generic environmental claim \((?P<g>.+)\)$
  zh-HK: 籠統的環保聲明（{g}）
  zh-CN: 笼统的环保声明（{g}）
- en: ^Provide a quantified output and link to the IRIS\+ metric and source document supporting the claim\.$
  zh-HK: 提供量化產出，並連結支持該聲明的 IRIS+ 指標及來源文件。
  zh-CN: 提供量化产出，并关联支持该声明的 IRIS+ 指标及来源文件。
- en: '^Replace the buzzword phrasing with a measurable target: .*$'
  zh-HK: 以可量度的目標取代流行語：甚麼數字成果、何時達成、惠及哪些人？
  zh-CN: 以可衡量的目标取代流行语：什么数字成果、何时达成、惠及哪些人？
- en: ^Attach the source document or system export that supports the figure\.$
  zh-HK: 附上支持該數字的來源文件或系統匯出資料。
  zh-CN: 附上支持该数字的来源文件或系统导出资料。
- en: '^Move the evidence up the NESTA ladder: .*$'
  zh-HK: 提升 NESTA 證據等級：前後比較、雙重差分或第三方評估。
  zh-CN: 提升 NESTA 证据等级：前后比较、双重差分或第三方评估。
- en: ^Name the recognised standard or proof behind the claim \(EU ECGT\)\.$
  zh-HK: 列明支持該聲明的公認標準或證明（歐盟 ECGT）。
  zh-CN: 列明支持该声明的公认标准或证明（欧盟 ECGT）。
- en: ^No evidence of third-party verification or auditing$
  zh-HK: 沒有第三方核實或審核的證據
  zh-CN: 没有第三方核实或审核的证据
- en: ^Missing negative-impact metrics for sector$
  zh-HK: 缺少該行業的負面影響指標
  zh-CN: 缺少该行业的负面影响指标
- en: ^Reporting appears to cherry-pick positive metrics$
  zh-HK: 報告似乎只挑選正面指標
  zh-CN: 报告似乎只挑选正面指标
- en: ^SDG/theme claims lack supporting metric evidence$
  zh-HK: 可持續發展目標／主題聲明缺乏指標證據
  zh-CN: 可持续发展目标／主题声明缺乏指标证据
- en: ^Claims use aspirational language without concrete evidence$
  zh-HK: 聲明使用願景式用語，缺乏具體證據
  zh-CN: 声明使用愿景式用语，缺乏具体证据
- en: ^(?P<n>\d+) metrics? reported · (?P<x>\d+) of (?P<a>\d+) reference metrics(?P<rest>.*)$
  zh-HK: 已報告 {n} 項指標 · 參考指標 {x}/{a}{rest:note}
  zh-CN: 已报告 {n} 项指标 · 参考指标 {x}/{a}{rest:note}
